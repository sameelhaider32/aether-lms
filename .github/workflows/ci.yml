name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - name: Audit locked development dependencies
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Generate fictional Office fixtures
        run: node tests/generate-office.cjs
      - name: Unit and security regressions
        run: npm run test:unit
      - name: Startup regressions on shared runner
        if: '!cancelled()'
        env:
          AETHER_SHARED_RUNNER: '1'
        run: npm run test:startup
      - name: Browser regressions
        timeout-minutes: 8
        if: '!cancelled()'
        run: npm run test:browser
      - name: Graphics and cancellation regressions
        if: '!cancelled()'
        run: node tests/fallbacks.cjs
      - name: Build installable extension
        run: python scripts/package.py
      - name: Verify packaged archive
        run: node tests/package.cjs
      - name: Test packaged extension in Chromium
        timeout-minutes: 8
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json | ConvertFrom-Json).version
          $env:AETHER_EXTENSION = (Resolve-Path "dist/aether-lms-extension-v$version").Path
          $env:AETHER_REPORT_DIR = Join-Path $PWD 'reports/packaged-ci'
          node tests/browser.cjs --smoke
          exit $LASTEXITCODE
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save tested extension download
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-extension
          path: |
            dist/*.zip
            dist/*-sha256.json
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
