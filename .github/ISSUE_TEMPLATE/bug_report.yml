name: Bug report
description: Report a problem using fictional or redacted examples.
body:
  - type: markdown
    attributes:
      value: Do not share passwords, cookies, student IDs, grades, or private course files. For security issues, use the repository's private vulnerability report instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the tool/page, student or TA view, and whether it also happens with Aether OFF.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Aether version, Chrome version, and operating system
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted screenshot or fictional example (optional)
