<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF resource preview</title><link rel="stylesheet" href="pdf.css"></head><body><div id="status" role="status">Loading PDF preview…</div><div id="pages" hidden><div id="paper"><canvas id="page" aria-label="PDF page preview"></canvas></div><nav aria-label="PDF pages and zoom"><button id="prev" type="button" aria-label="Previous page">←</button><span id="count" aria-live="polite"></span><button id="next" type="button" aria-label="Next page">→</button><button id="zoom-out" type="button" aria-label="Zoom out">−</button><span id="zoom" aria-live="polite">100%</span><button id="zoom-in" type="button" aria-label="Zoom in">+</button><select id="fit" aria-label="Fit PDF"><option value="page">Fit page</option><option value="width">Fit width</option></select></nav></div><script type="module" src="pdf.js"></script></body></html>
